# The steps that give a job everything building or testing gg needs beyond the
# Rust CI image: Node, every arm's program-language toolchain, the C# arm's
# build toolchains, and the npm workspace. The kit's `rust` job takes them
# through setup-steps.yml, and each of gg's own jobs that compiles gg through
# container-steps.yml or, on the arm64 pool, directly.
#
# scripts/ci/gg-ci-toolchains.sh does the work, and its header is the argument:
# it installs into one directory, which this cache saves and restores whole, and
# links the places under $HOME the installers write to into it. Every job using
# these steps restores and saves the same entry, so whichever job succeeds
# first warms the others. Cache@2 saves only when its key missed and the job
# succeeded.
#
# The key names every file that decides what is installed: the installers and
# their download helper, gg's shared build shell, every arm's version pin, the
# lock each npm-delivered build tool's tree is installed from, the Rust
# toolchain the wasm standard library follows, and the provisioner, which pins
# Node. `flavor` separates the Rust CI image's jobs from host jobs, whose home
# directory and account differ.

parameters:
  - name: flavor
    type: string
    default: rust-ci-image
    values:
      - rust-ci-image
      - host

steps:
  - task: Cache@2
    displayName: Restore gg's toolchains
    inputs:
      key: 'gg-toolchains | v1 | "$(Agent.OS)" | "$(Agent.OSArchitecture)" | "${{ parameters.flavor }}" | scripts/ci/install-*.sh, scripts/ci/fetch.sh, scripts/gg-*.sh, packages/gg-sandbox-*/*-version.sh, scripts/gg-npm-locks/**/package-lock.json | rust-toolchain.toml | scripts/ci/gg-ci-toolchains.sh'
      path: $(Pipeline.Workspace)/gg-toolchains

  - script: scripts/ci/gg-ci-toolchains.sh "$(Pipeline.Workspace)/gg-toolchains"
    displayName: Provision Node and gg's toolchains

  # Building crates/gg reflects two of its catalogues with the pinned
  # `typescript` of the npm workspace, which names no package of the project's
  # feed, so it installs from the public registry alone.
  - script: npm ci --no-audit --no-fund
    displayName: Install the npm workspace
