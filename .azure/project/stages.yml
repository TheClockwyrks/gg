# gg's own stages, which azure-pipelines.yml includes after the publish stage;
# the mirror waits on each. The kit hands every parameter below, and the
# rendered ci/tests/test_wiring.py holds this file to them and to the stages
# render.py's PROJECT_PIPELINE names.
#
# `release` runs on a `v*` tag once every gate passed, gg's version gate on
# both architectures included (jobs.yml), and publishes the release under the
# tag's version with its `v` stripped, which is the crate's version and what
# `gg --version` reports:
#
#   toolchains_<arch>    containers/gg-toolchains/Dockerfile built natively on
#                        each architecture and pushed as
#                        test-cabinet-gg-toolchains:<version>-<arch>
#   toolchains_manifest  the two fused into the multi-arch
#                        test-cabinet-gg-toolchains:<version>, which the `-gg`
#                        run images of a driver pinning <version> copy from
#   gg_publish           the binaries and the reference documents the gg_<arch>
#                        jobs kept, uploaded to the `gg-releases` container
#                        under v<version>/ by scripts/ci/publish-gg.sh
#
# The upload comes last, so a release whose toolchains image failed to build
# publishes no binary a deployment could fetch without the tree its run images
# copy. scripts/ci/gg-toolchains-image.sh says what the image commands do.
#
# `the-test-cabinet-acr` (registryEndpoint) is the Docker Registry connection
# holding AcrPush on the registry, and `tcab-gg-publish` an Azure Resource
# Manager connection (workload identity federation) holding Storage Blob Data
# Contributor on testcabinetartifacts and nothing else.
parameters:
  - name: rustImage
    type: string
  - name: registry
    type: string
  - name: registryEndpoint
    type: string
  - name: arm64Pool
    type: string

stages:
  - stage: release
    displayName: Release
    dependsOn: gates
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    variables:
      releaseVersion: $[ replace(variables['Build.SourceBranch'], 'refs/tags/v', '') ]
    jobs:
      - ${{ each arch in split('amd64,arm64', ',') }}:
          - job: toolchains_${{ arch }}
            displayName: "gg toolchains image (${{ arch }})"
            timeoutInMinutes: 120
            pool:
              ${{ if eq(arch, 'amd64') }}:
                vmImage: ubuntu-24.04
              ${{ else }}:
                name: ${{ parameters.arm64Pool }}
            steps:
              - checkout: self
                fetchDepth: 1
                clean: true
              - ${{ if eq(arch, 'amd64') }}:
                  - script: |
                      sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
                      df -h /
                    displayName: Free the agent's disk of the software the job never uses
              - task: Docker@2
                displayName: Log in to ${{ parameters.registry }}
                retryCountOnTaskFailure: 2
                inputs:
                  command: login
                  containerRegistry: ${{ parameters.registryEndpoint }}
              - script: scripts/ci/gg-toolchains-image.sh build "$(releaseVersion)" --push
                displayName: Build and push the toolchains image

      - job: toolchains_manifest
        displayName: "gg toolchains image: multi-arch tag"
        dependsOn:
          - toolchains_amd64
          - toolchains_arm64
        steps:
          - checkout: self
            fetchDepth: 1
            clean: true
          - task: Docker@2
            displayName: Log in to ${{ parameters.registry }}
            retryCountOnTaskFailure: 2
            inputs:
              command: login
              containerRegistry: ${{ parameters.registryEndpoint }}
          - script: scripts/ci/gg-toolchains-image.sh manifest "$(releaseVersion)"
            displayName: Fuse the architectures

      - job: gg_publish
        displayName: "gg: upload to gg-releases"
        dependsOn: toolchains_manifest
        steps:
          - checkout: self
            fetchDepth: 1
            clean: true
          - ${{ each arch in split('amd64,arm64', ',') }}:
              - download: current
                artifact: gg-${{ arch }}
                displayName: Fetch gg (${{ arch }})
          - task: AzureCLI@2
            displayName: Upload gg's binaries and reference documents
            inputs:
              azureSubscription: tcab-gg-publish
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                dist="$(Agent.TempDirectory)/gg"
                mkdir -p "$dist"
                # By name, not by glob. Both architectures pack a
                # `gg-reference.tar.gz` (scripts/ci/gg-dist.sh projects the
                # documents on each, so the command is gated on each), and the
                # documents are architecture-independent, so a glob would copy
                # two files onto one name and whichever landed last would win
                # in silence. These three are exactly what publish-gg.sh
                # uploads.
                cp "$(Pipeline.Workspace)/gg-amd64/gg-x86_64-unknown-linux-musl" "$dist"/
                cp "$(Pipeline.Workspace)/gg-arm64/gg-aarch64-unknown-linux-musl" "$dist"/
                cp "$(Pipeline.Workspace)/gg-amd64/gg-reference.tar.gz" "$dist"/
                scripts/ci/publish-gg.sh "$dist" "$(Build.SourceBranch)"
