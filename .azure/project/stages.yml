# gg's own stages, which azure-pipelines.yml includes after the publish stage;
# the mirror waits on each. `release` runs on a `v*` tag, after the gates, and
# publishes gg's binaries, its reference documents and its toolchains image. The
# kit hands every parameter below and the rendered ci/tests/test_wiring.py holds
# this file to them and to the stages render.py's PROJECT_PIPELINE names.
parameters:
  - name: rustImage
    type: string
  - name: registry
    type: string
  - name: registryEndpoint
    type: string
  - name: arm64Pool
    type: string

stages:
  - stage: release
    displayName: Release
    dependsOn: gates
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    jobs:
      - job: release
        displayName: Release (written with the pipeline)
        steps:
          - checkout: none
          - script: echo "gg's release jobs are not written yet."
