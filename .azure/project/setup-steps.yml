# The kit's `rust` job takes these steps after it fetched the dependencies and
# before its first check (the kit's PROJECT_SETUP). Its clippy, rustdoc and
# nextest compile crates/gg, whose build script reflects every arm's signature
# catalogue with that arm's toolchain and the workspace's `typescript`, none of
# which the Rust CI image carries, so they come from the toolchains cache every
# job of gg's that compiles it shares.
steps:
  - template: toolchains-steps.yml
