# The first steps of each of gg's own jobs that compiles gg inside the Rust CI
# image, in the order the kit's `rust` job takes them: the checkout, the disk
# reclaim, the cargo home and the job's own build output, the fetch of the
# project's dependencies from Azure, and then gg's toolchains and Node
# (toolchains-steps.yml).
#
# The cargo home's cache is the kit's `rust` job's entry: same key, same path. A
# job including these steps names the variables that job names (CARGO_HOME
# under $(ciCache), CARGO_INCREMENTAL 0) and the `contracts` repository under
# `uses:`, which puts it in the scope of the token scripts/ci/git-sources.sh
# fetches it with. Its build output is its own entry, named by `targetKey`.

parameters:
  - name: targetKey
    type: string

steps:
  - checkout: self
    fetchDepth: 1
    clean: true

  - script: |
      sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      df -h /
    displayName: Free the host's disk of the software the job never uses
    target: host

  - task: Cache@2
    displayName: Restore the cargo home
    inputs:
      key: 'cargo-home | v2 | "$(Agent.OS)" | rust-toolchain.toml | **/Cargo.toml, !**/target/**'
      restoreKeys: |
        cargo-home | v2 | "$(Agent.OS)" | rust-toolchain.toml
      path: $(ciCache)/cargo-home

  - task: Cache@2
    displayName: Restore the build output
    inputs:
      key: '${{ parameters.targetKey }} | v1 | "$(Agent.OS)" | rust-toolchain.toml | Cargo.lock'
      restoreKeys: |
        ${{ parameters.targetKey }} | v1 | "$(Agent.OS)" | rust-toolchain.toml
      path: target

  - script: scripts/ci/git-sources.sh
    displayName: Fetch the project's dependencies from Azure
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - template: toolchains-steps.yml
