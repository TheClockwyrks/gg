# gg's own jobs of the gates stage, which azure-pipelines.yml includes after the
# kit's jobs, so the mirror and the release wait on them through the stage. The
# kit hands every parameter below, and the rendered ci/tests/test_wiring.py
# holds this file to them.
#
#   gg_tests_<k>_of_4  one hash partition of gg's suite, which the kit's
#                      rust-test leaves out (crates/gg/Cargo.toml says why)
#   gg_amd64           gg's static musl binary and its reference documents,
#   gg_arm64           built natively on each architecture and kept as the
#                      run's `gg-<arch>` artifact
#
# Every ref runs them, so a release tag's binaries come off a build that
# master's runs have already exercised. On a `v*` tag the build fails when
# `gg --version` is not the tag's version, and the `release` stage
# (stages.yml) then publishes the two artifacts.
#
# The container jobs pull the Rust CI image through the registry's service
# connection, and the agent retries that pull (VSTSAGENT_DOCKER_ACTION_RETRIES):
# it runs before any step, where `retryCountOnTaskFailure` cannot reach, and
# the registry's token exchange times out on its side now and then.
parameters:
  - name: rustImage
    type: string
  - name: registry
    type: string
  - name: registryEndpoint
    type: string
  - name: arm64Pool
    type: string

jobs:
  # Each entry is a `k/N` nextest takes as a hash partition, N their count.
  - ${{ each partition in split('1/4,2/4,3/4,4/4', ',') }}:
      - job: gg_tests_${{ replace(partition, '/', '_of_') }}
        displayName: "gg: tests (${{ partition }})"
        timeoutInMinutes: 120
        uses:
          repositories:
            - contracts
        container:
          image: ${{ parameters.rustImage }}
          endpoint: ${{ parameters.registryEndpoint }}
        variables:
          CARGO_HOME: $(ciCache)/cargo-home
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          VSTSAGENT_DOCKER_ACTION_RETRIES: "true"
        steps:
          - template: container-steps.yml
            parameters:
              targetKey: cargo-target-gg-tests
          - script: scripts/ci/gg-test-build.sh
            displayName: Build
          - script: scripts/ci/gg-test.sh ${{ partition }}
            displayName: Test
          - script: scripts/ci/prune-target.sh target
            displayName: Prune the build output to what the next build reads
            condition: succeededOrFailed()

  # The amd64 leg runs inside the Rust CI image. The arm64 leg runs on the
  # organisation's arm64 pool, for which no CI image is built: it installs the
  # musl toolchain, Ruby and rustup there, and both legs then provision gg's
  # toolchains and Node through the same steps and script, cached per flavor.
  - ${{ each arch in split('amd64,arm64', ',') }}:
      - job: gg_${{ arch }}
        displayName: "gg: static build (${{ arch }})"
        timeoutInMinutes: 120
        uses:
          repositories:
            - contracts
        ${{ if eq(arch, 'amd64') }}:
          container:
            image: ${{ parameters.rustImage }}
            endpoint: ${{ parameters.registryEndpoint }}
          variables:
            CARGO_HOME: $(ciCache)/cargo-home
            CARGO_INCREMENTAL: 0
            VSTSAGENT_DOCKER_ACTION_RETRIES: "true"
        ${{ else }}:
          pool:
            name: ${{ parameters.arm64Pool }}
        steps:
          - ${{ if eq(arch, 'amd64') }}:
              - template: container-steps.yml
                parameters:
                  targetKey: cargo-target-gg-dist
          - ${{ else }}:
              - checkout: self
                fetchDepth: 1
                clean: true
              - script: scripts/ci/git-sources.sh
                displayName: Fetch the project's dependencies from Azure
                env:
                  SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              # musl-gcc links the C that `ring` and `wasmtime` compile for the
              # musl target, and gg's Ruby arm reflects its catalogue with YARD.
              # The install waits for the package lock, which the agent's own
              # unattended upgrade holds while it runs.
              - script: sudo apt-get update && sudo apt-get -o DPkg::Lock::Timeout=600 install -y musl-tools ruby
                displayName: Install the musl toolchain and Ruby
              - script: |
                  set -euo pipefail
                  if ! command -v rustup >/dev/null 2>&1; then
                    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                      | sh -s -- -y --profile minimal --default-toolchain none
                    echo "##vso[task.prependpath]$HOME/.cargo/bin"
                  fi
                displayName: Install rustup
              - script: rustup show
                displayName: Show the Rust toolchain
              - template: toolchains-steps.yml
                parameters:
                  flavor: host

          - script: scripts/ci/gg-dist.sh "$(Build.ArtifactStagingDirectory)/gg"
            displayName: Build gg (static musl)

          # Passes any ref but a tag, and fails a tag whose gg reports another
          # version.
          - script: >-
              scripts/ci/gg-version-gate.sh
              "$(Build.ArtifactStagingDirectory)/gg/gg-$(uname -m)-unknown-linux-musl"
              "$(Build.SourceBranch)"
            displayName: gg's version is the tag's

          - publish: $(Build.ArtifactStagingDirectory)/gg
            artifact: gg-${{ arch }}
            displayName: Keep gg for the release

          - ${{ if eq(arch, 'amd64') }}:
              - script: scripts/ci/prune-target.sh target
                displayName: Prune the build output to what the next build reads
                condition: succeededOrFailed()
