# gg's own jobs of the gates stage, which azure-pipelines.yml includes after the
# kit's jobs, so the mirror waits on them through the stage. The kit hands every
# parameter below and the rendered ci/tests/test_wiring.py holds this file to
# them. gg's test partitions and its per-architecture builds are written here
# once the pipeline exists; until then the stage runs the kit's jobs alone.
parameters:
  - name: rustImage
    type: string
  - name: registry
    type: string
  - name: registryEndpoint
    type: string
  - name: arm64Pool
    type: string

jobs: []
